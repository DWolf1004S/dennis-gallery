<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENNIS SPEKTOR | Fine Art Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Montserrat:wght@200;300;400&display=swap");
        :root { --bg-color: #fafafa; --text-main: #1a1a1a; }
        body { font-family: "Montserrat", sans-serif; background-color: var(--bg-color); color: var(--text-main); scroll-behavior: smooth; }
        .logo-font { font-family: "Cinzel", serif; }
        .gallery-container { column-count: 1; column-gap: 2rem; }
        @media (min-width: 640px) { .gallery-container { column-count: 2; } }
        @media (min-width: 1024px) { .gallery-container { column-count: 3; } }
        .photo-card { break-inside: avoid; margin-bottom: 2rem; position: relative; overflow: hidden; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .photo-card img { transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(30%); }
        .photo-card:hover img { transform: scale(1.03); filter: grayscale(0%); }
        .photo-overlay { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px); opacity: 0; transition: all 0.4s ease; transform: translateY(10px); }
        .photo-card:hover .photo-overlay { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="antialiased">
    <header class="py-24 px-4 text-center">
        <div class="max-w-5xl mx-auto">
            <div class="mb-16">
                <h1 class="logo-//font text-4xl md:text-6xl tracking-[0.4em] uppercase font-light text-gray-900">Dennis Spektor</h1>
                <div class="flex items-center justify-center gap-6 mt-6">
                    <div class="h-[1px] w-12 bg-gray-300"></div>
                    <span class="text-[10px] tracking-[0.6em] uppercase text-gray-400 font-light">Fine Art Photography</span>
                    <div class="h-[1px] w-12 bg-gray-300"></div>
                </div>
            </div>
            <nav id="category-nav" class="flex justify-center gap-8 text-[11px] tracking-[0.2em] uppercase text-gray-400 font-light"></nav>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="gallery" class="gallery-container"></div>
    </main>
    <footer class="py-24 border-t border-gray-100 text-center bg-white">
        <div class="flex flex-col items-center gap-10">
            <a href="https://instagram.com/den1004s" target="_blank" class="group flex flex-col items-center gap-3 transition-all duration-500">
                <div class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 group-hover:border-black group-hover:text-black transition-all duration-500">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <span class="text-[10px] tracking-[0.3em] uppercase text-gray-400 group-hover:text-black transition-colors font-light">Instagram</span>
            </a>
            <p class="text-[9px] tracking-[0.4em] text-gray-300 uppercase font-light">&copy; 2026 Dennis Spektor. All Rights Reserved.</p>
        </div>
    </footer>
    <script>
        // EMBEDDED PHOTOS TO AVOID ANY LOADING ERRORS
        const photos = [
            { id: 1, url: "https://i.ibb.co/vV78jP7/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 2, url: "https://i.ibb.co/pL1mS6B/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 3, url: "https://i.ibb.co/S3qN3rX/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 4, url: "https://i.ibb.co/ZQ1HZh1/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 5, url: "https://i.ibb.co/0p8LN3yQ/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 6, url: "https://i.ibb.co/1Jb3MVQk/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 7, url: "https://i.ibb.co/NnxLdxCt/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 8, url: "https://i.ibb.co/RpFdw8W0/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 9, url: "https://i.ibb.co/Y7HYKW97/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 10, url: "https://i.ibb.co/v4xzgmbF/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 11, url: "https://i.ibb.co/kghHHTkV/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 12, url: "https://i.ibb.co/CfXLrkN/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 13, url: "https://i.ibb.co/ycDgykzM/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 14, url: "https://i.ibb.co/Vc33yRK7/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 15, url: "https://i.ibb.co/fzfz2CKq/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 16, url: "https://i.ibb.co/PZnt15GN/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 17, url: "https://i.ibb.co/HpPZ3jX9/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 },
            { id: 18, url: "https://i.ibb.co/rGLkQnFt/image.jpg", category: "Unforgettable", likes: 0, downloads: 0 }
        ];

        function setupCategories() {
            const nav = document.getElementById("category-nav");
            nav.innerHTML = "";
            const categories = ["all", ...new Set(photos.map(p => p.category))];
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.innerText = cat === "all" ? "Collection" : cat;
                btn.className = "hover:text-black transition-colors duration-300 cursor-pointer uppercase";
                btn.onclick = () => renderGallery(cat);
                nav.appendChild(btn);
            });
        }

        function renderGallery(filter = "all") {
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";
            const filteredPhotos = filter === "all" ? photos : photos.filter(p => p.category === filter);
            filteredPhotos.forEach(photo => {
                gallery.innerHTML += `
                    <div class="photo-card group cursor-pointer">
                        <img src="${photo.url}" alt="Fine Art" class="w-full h-auto shadow-sm">
                        <div class="photo-overlay absolute inset-0 flex flex-col justify-center items-center p-6">
                            <div class="flex gap-8 text-gray-500">
                                <button onclick="handleLike(${photo.id})" class="flex items-center gap-2 hover:text-black transition-colors duration-300">
                                    <i class="fa-regular fa-heart"></i>
                                    <span class="text-xs font-light tracking-widest">${photo.likes}</span>
                                </button>
                                <button onclick="handleDownload(${photo.id})" class="flex items-center gap-2 hover:text-black transition-colors duration-300">
                                    <i class="fa-solid fa-arrow-down"></i>
                                    <span class="text-xs font-light tracking-widest">${photo.downloads}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function handleLike(id) {
            const photo = photos.find(p => p.id === id);
            if (photo) { photo.likes++; renderGallery(); }
        }

        function handleDownload(id) { alert("Downloading high-resolution masterpiece..."); }

        window.onload = () => { setupCategories(); renderGallery(); };
    </script>
</body>
</html>
